[project]
name = "config-lang-translator"
version = "0.1.0"
description = "Translator for educational configuration language to TOML"
requires-python = ">=3.11"
dependencies = ["lark>=1.1.5"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.5"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 79
